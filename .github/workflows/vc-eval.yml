name: AI voice conversion eval (MeanVC2)
# Feasibility check for on-device AI voice conversion:
# runs the open MeanVC2 streaming zero-shot model on an Apple Silicon runner with Japanese test voices
# made by macOS text-to-speech (no real people's voices), and measures CPU speed.
on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test voices (macOS text-to-speech)
        run: |
          mkdir -p eval
          say -v '?' | grep -Ei 'ja_JP|en_US' | head -40 || true
          # keep only voices that really render audio on this machine (some are not downloaded)
          OK=""
          for v in $(say -v '?' | awk '/ja_JP/{print $1}'); do
            say -v "$v" -o /tmp/t.aiff "こんにちは、テストです。" 2>/dev/null || continue
            sz=$(stat -f%z /tmp/t.aiff); echo "$v -> $sz bytes"
            [ "$sz" -gt 30000 ] && OK="$OK $v"
          done
          echo "Japanese voices that work:$OK"
          set -- $OK
          TXT1="こんにちは。今日はいい天気ですね。これは声の変換のテストです。うまく聞こえていますか。"
          TXT2="昨日は友達と駅前のカフェに行って、新しいアプリの話をたくさんしました。また一緒に遊ぼうね。"
          # source: Japanese (Kyoko). Targets: other working voices (English male/female) as "friends" —
          # tests whether Japanese speech stays intelligible when it takes another person's timbre
          say -v Kyoko -o eval/src_ja.aiff "$TXT1"
          say -v Kyoko -o eval/src_ja2.aiff "$TXT2"
          N=0
          for v in Daniel Alex Fred Tom Aaron Arthur Ralph Samantha Karen Moira; do
            say -v "$v" -o /tmp/t.aiff "Yesterday I went to a cafe near the station with my friend, and we talked about our new app for a long time." 2>/dev/null || continue
            sz=$(stat -f%z /tmp/t.aiff); echo "$v -> $sz bytes"
            if [ "$sz" -gt 60000 ]; then cp /tmp/t.aiff "eval/ref_$v.aiff"; N=$((N+1)); fi
            [ $N -ge 3 ] && break
          done
          echo "VOICES=src Kyoko, refs: $(ls eval | grep ref_ | tr '\n' ' ')" >> $GITHUB_ENV
          for f in eval/*.aiff; do afconvert -f WAVE -d LEI16@16000 -c 1 "$f" "${f%.aiff}.wav"; done
          ls -la eval

      - name: Install MeanVC2
        run: |
          git clone --depth 1 https://github.com/ASLP-lab/MeanVC2.git mvc
          cd mvc
          python -m pip install --upgrade pip
          pip install torch==2.6.0 torchaudio==2.6.0
          grep -viE '^(torch|torchaudio)([=<> ]|$)' requirements.txt > req.txt || true
          cat req.txt
          pip install huggingface_hub safetensors
          # one by one so a package that can't build on macOS (fairseq …) doesn't stop the rest
          while IFS= read -r line; do
            pkg=$(echo "$line" | sed 's/#.*//' | xargs); [ -z "$pkg" ] && continue
            case "$pkg" in fairseq*|wandb*) echo "skip $pkg"; continue;; esac
            pip install "$pkg" >/dev/null 2>&1 && echo "ok   $pkg" || echo "FAIL $pkg"
          done < req.txt
          pip install "jiwer<4"
          python initialization.py --task all
          if [ ! -s preprocess/ckpts/wavlm_large.pt ]; then
            curl -L --fail -o preprocess/ckpts/wavlm_large.pt https://huggingface.co/s3prl/converted_ckpts/resolve/main/wavlm_large.pt \
              || curl -L --fail -o preprocess/ckpts/wavlm_large.pt https://github.com/microsoft/unilm/releases/download/wavlm/WavLM-Large.pt \
              || echo "::warning::WavLM-Large not downloaded"
          fi
          ls -la preprocess/ckpts
          echo "---- where the speaker-verification checkpoint comes from ----"
          grep -rn "wavlm_large_finetune\|drive.google\|huggingface.co\|hf_hub_download\|repo_id" --include=*.py --include=*.md . | grep -v "^./ckpts" | head -60 || true
          SV=preprocess/ckpts/wavlm_large_finetune.pth
          pip install gdown >/dev/null 2>&1 || true
          gdown 1-aE1NfzpRCLxA4GUxX9ITI3F9LlbtEGP -O "$SV" || echo "gdown failed"
          [ -s "$SV" ] && echo "got SV via Google Drive ($(stat -f%z "$SV") bytes)"
          for u in \
            https://huggingface.co/ASLP-lab/MeanVC2/resolve/main/wavlm_large_finetune.pth \
            https://huggingface.co/ASLP-lab/MeanVC/resolve/main/wavlm_large_finetune.pth \
            https://huggingface.co/datasets/ASLP-lab/MeanVC2/resolve/main/wavlm_large_finetune.pth; do
            [ -s "$SV" ] && break
            curl -sL --fail -o "$SV" "$u" && echo "got SV from $u" || rm -f "$SV"
          done
          ls -la preprocess/ckpts
          find ckpts -maxdepth 3 -type f -exec ls -la {} \; | head -40

      - name: Convert Japanese source to each target voice, and time it
        run: |
          cd mvc
          python - <<'PY'
          import os, sys, time, subprocess, wave, glob
          env = {**os.environ, 'OMP_NUM_THREADS': '1'}
          refs = sorted(glob.glob('../eval/ref_*.wav'))
          jobs = []
          for r in refs:
              name = os.path.basename(r)[4:-4]
              jobs.append(('../eval/src_ja.wav', r, f'../eval/out_ja_as_{name}_120ms.wav', '120ms'))
          if refs:
              jobs.append(('../eval/src_ja2.wav', refs[0], f'../eval/out_ja2_as_{os.path.basename(refs[0])[4:-4]}_40ms.wav', '40ms'))
          for src, tgt, out, model in jobs:
              t = time.time()
              r = subprocess.run([sys.executable, 'src/infer/infer_e2e.py', '--model', model, '--source-wav', src, '--target-wav', tgt,
                                  '--device', 'cpu', '--output-wav', out], capture_output=True, text=True, env=env)
              dt = time.time() - t
              print(r.stdout[-1500:]); print(r.stderr[-2500:])
              w = wave.open(src); secs = w.getnframes() / w.getframerate()
              print(f'RESULT {out}: {secs:.1f}s audio, {dt:.1f}s incl. model load (1 thread), exists={os.path.exists(out)}')
          PY
          ls -la ../eval
          echo "Voices: $VOICES"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vc-eval
          path: eval/
          retention-days: 7

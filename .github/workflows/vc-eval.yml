name: AI voice conversion eval (MeanVC2)
# Feasibility check for on-device AI voice conversion:
# runs the open MeanVC2 streaming zero-shot model on an Apple Silicon runner with Japanese test voices
# made by macOS text-to-speech (no real people's voices), and measures CPU speed.
on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test voices (macOS text-to-speech)
        run: |
          mkdir -p eval
          say -v '?' | grep -Ei 'ja_JP|en_US' | head -40 || true
          # keep only voices that really render audio on this machine (some are not downloaded)
          OK=""
          for v in $(say -v '?' | awk '/ja_JP/{print $1}'); do
            say -v "$v" -o /tmp/t.aiff "こんにちは、テストです。" 2>/dev/null || continue
            sz=$(stat -f%z /tmp/t.aiff); echo "$v -> $sz bytes"
            [ "$sz" -gt 30000 ] && OK="$OK $v"
          done
          echo "Japanese voices that work:$OK"
          set -- $OK
          TXT1="こんにちは。今日はいい天気ですね。これは声の変換のテストです。うまく聞こえていますか。"
          TXT2="昨日は友達と駅前のカフェに行って、新しいアプリの話をたくさんしました。また一緒に遊ぼうね。"
          A="$1"; B="${2:-$1}"
          for v in $OK; do case "$v" in Kyoko) A=Kyoko;; esac; done
          for v in $OK; do [ "$v" != "$A" ] && B="$v" && case "$v" in Reed|Rocko|Eddy|Grandpa) break;; esac; done
          say -v "$A" -o eval/src_a.aiff "$TXT1"; say -v "$B" -o eval/ref_b.aiff "$TXT2"
          say -v "$B" -o eval/src_b.aiff "$TXT1"; say -v "$A" -o eval/ref_a.aiff "$TXT2"
          echo "VOICES=A:$A B:$B" >> $GITHUB_ENV
          for f in eval/*.aiff; do afconvert -f WAVE -d LEI16@16000 -c 1 "$f" "${f%.aiff}.wav"; done
          ls -la eval

      - name: Install MeanVC2
        run: |
          git clone --depth 1 https://github.com/ASLP-lab/MeanVC2.git mvc
          cd mvc
          python -m pip install --upgrade pip
          pip install torch==2.5.1 torchaudio==2.5.1
          grep -viE '^(torch|torchaudio)([=<> ]|$)' requirements.txt > req.txt || true
          cat req.txt
          pip install huggingface_hub safetensors
          # one by one so a package that can't build on macOS (fairseq …) doesn't stop the rest
          while IFS= read -r line; do
            pkg=$(echo "$line" | sed 's/#.*//' | xargs); [ -z "$pkg" ] && continue
            case "$pkg" in fairseq*|wandb*) echo "skip $pkg"; continue;; esac
            pip install "$pkg" >/dev/null 2>&1 && echo "ok   $pkg" || echo "FAIL $pkg"
          done < req.txt
          pip install "jiwer<4"
          python initialization.py --task all
          if [ ! -s preprocess/ckpts/wavlm_large.pt ]; then
            curl -L --fail -o preprocess/ckpts/wavlm_large.pt https://huggingface.co/s3prl/converted_ckpts/resolve/main/wavlm_large.pt \
              || curl -L --fail -o preprocess/ckpts/wavlm_large.pt https://github.com/microsoft/unilm/releases/download/wavlm/WavLM-Large.pt \
              || echo "::warning::WavLM-Large not downloaded"
          fi
          ls -la preprocess/ckpts
          find ckpts -maxdepth 3 -type f -exec ls -la {} \; | head -40

      - name: Convert (A → B, B → A) and time it
        run: |
          cd mvc
          run() {
            python - "$@" <<'PY'
          import sys, time, subprocess, wave
          src, tgt, out, model = sys.argv[1:5]
          cfg = {'120': ('meanvc2_120ms_40ms', 'config_120ms_40ms', 12), '40': ('meanvc2_40ms_40ms', 'config_40ms_40ms', 4)}[model]
          t = time.time()
          r = subprocess.run([sys.executable, 'src/infer/infer_e2e.py', '--source-wav', src, '--target-wav', tgt,
              '--ckpt-path', f'ckpts/pretrained_models/{cfg[0]}.safetensors', '--model-config', f'src/config/{cfg[1]}.json',
              '--vocoder-ckpt-path', 'ckpts/vocos/vocos.pt', '--chunk-size', str(cfg[2]), '--steps', '3', '--output-wav', out],
              capture_output=True, text=True, env={**__import__('os').environ, 'OMP_NUM_THREADS': '1'})
          dt = time.time() - t
          print(r.stdout[-2000:]); print(r.stderr[-3000:])
          w = wave.open(src); secs = w.getnframes() / w.getframerate()
          print(f'RESULT {out}: {secs:.1f}s audio in {dt:.1f}s (incl. model load) -> RTF {dt/secs:.2f} (1 thread)')
          PY
          }
          run ../eval/src_a.wav ../eval/ref_b.wav ../eval/out_a_to_b_120ms.wav 120
          run ../eval/src_b.wav ../eval/ref_a.wav ../eval/out_b_to_a_120ms.wav 120
          run ../eval/src_a.wav ../eval/ref_b.wav ../eval/out_a_to_b_40ms.wav 40
          ls -la ../eval
          echo "Voices: $VOICES"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vc-eval
          path: eval/
          retention-days: 7
